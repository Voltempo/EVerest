          implementation_id: main
  ev_manager_5:
    module: EvManager
    config_module:
      connector_id: 5
      auto_enable: true
      auto_exec: false
      dc_target_current: 468
      dc_target_voltage: 800
      dc_max_power_limit: 375000
      dc_max_current_limit: 500
      dc_max_voltage_limit: 900
    connections:
      ev_board_support:
        - module_id: yeti_driver_5
          implementation_id: ev_board_support
      ev:
        - module_id: iso15118_car_5
          implementation_id: ev
      slac:
        - module_id: slac_5
          implementation_id: ev
  token_provider_5:
    module: DummyTokenProvider
    config_implementation:
      main:
        token: TOKEN5
        connector_id: 5
    connections:
      evse:
        - module_id: evse_manager_5
          implementation_id: evse
  api_sink_5:
    module: EnergyNode
    mapping:
      module:
        evse: 5
    config_module:
      # Per-connector ceiling. The API module only wires up set_limit_* for an EVSE that has a sink
      # with a matching evse mapping, so one of these per connector is mandatory, not optional.
      fuse_limit_A: 600.0
      phase_count: 3
    connections:
      energy_consumer:
        - module_id: evse_manager_5
          implementation_id: energy_grid
  # ------------------------------------------------------------------ connector 6
  iso15118_charger_6:
    module: EvseV2G
    config_module:
      # Explicit, never 'auto'. EvseV2G resolves 'auto' to a hard-coded eth1 (v2g_ctx.cpp), which
      # would put every charger on one link and let cars pair with the wrong one.
      device: ev6-evse
      tls_security: allow
    connections:
      security:
        - module_id: evse_security
          implementation_id: main
  iso15118_car_6:
    module: PyEvJosev
    config_module:
      # The other end of connector 6's veth pair. 'auto' picks the first interface with an IPv6
      # link-local address, which is the same one for every car.
      device: ev6-car
      supported_DIN70121: true
      supported_ISO15118_2: true
  evse_manager_6:
    module: EvseManager
    config_module:
      # The connector's id within its own vSECC, because that is what OCPP demands (see local_id).
      # With one vSECC this is the same as the connector's position on the charger.
      connector_id: 6
      # eMI3-style id presented to the vehicle over ISO 15118. Globally unique across the charger even
      # though connector_id is not - nothing in OCPP 1.6 carries this string, so it is free to be the
      # human-meaningful one.
      evse_id: UK*VTP*E00001*6
      # Kept keyed on the connector's position on the charger, not its board. DIN 70121 wants a
      # fixed-width id and nothing reads it back, so global numbering is the safer choice.
      evse_id_din: 49A80737A45676
      session_logging: true
      session_logging_xml: false
      session_logging_path: /tmp/everest-logs
      charge_mode: DC
      hack_allow_bpt_with_iso2: true
      # Load-bearing, and off by default. Without it an idle connector keeps asking for its share of
      # the site, so one vehicle on an otherwise empty charger is held to site/connectors rather than
      # its own rating - which is exactly the real charger's flaw, arrived at by accident. With it,
      # idle connectors release their share and the vehicles that are charging get it.
      request_zero_power_in_idle: true
    connections:
      bsp:
        - module_id: yeti_driver_6
          implementation_id: board_support
      powermeter_car_side:
        - module_id: powersupply_dc_6
          implementation_id: powermeter
      slac:
        - module_id: slac_6
          implementation_id: evse
      hlc:
        - module_id: iso15118_charger_6
          implementation_id: charger
      powersupply_DC:
        - module_id: powersupply_dc_6
          implementation_id: main
      imd:
        - module_id: imd_6
          implementation_id: main
      over_voltage_monitor:
        - module_id: ovm_6
          implementation_id: main
  powersupply_dc_6:
    module: DCSupplySimulator
    config_implementation:
      main:
        # Defaults are 150 kW / 200 A, which bind well below the target. These are
        # config_implementation, not config_module - they live under provides.main in the manifest.
        max_power: 375000
        nominal_max_export_power: 375000
        nominal_max_import_power: 375000
        max_current: 500.0
        nominal_max_current: 500.0
  yeti_driver_6:
    module: YetiSimulator
    config_module:
      connector_id: 6
      max_current_A_import: 600.0
  slac_6:
    module: SlacSimulator
  imd_6:
    module: IMDSimulator
    config_implementation:
      main:
        selftest_success: true
        resistance_F_Ohm: 900000
  ovm_6:
    module: OVMSimulator
    config_implementation:
      main:
        simulate_emergency_shutdown: false
        simulate_error_delay: 5
    connections:
      power_supply:
        - module_id: powersupply_dc_6
          implementation_id: main
  ev_manager_6:
    module: EvManager
    config_module:
      connector_id: 6
      auto_enable: true
      auto_exec: false
      dc_target_current: 468
      dc_target_voltage: 800
      dc_max_power_limit: 375000
      dc_max_current_limit: 500
      dc_max_voltage_limit: 900
    connections:
      ev_board_support:
        - module_id: yeti_driver_6
          implementation_id: ev_board_support
      ev:
        - module_id: iso15118_car_6
          implementation_id: ev
      slac:
        - module_id: slac_6
          implementation_id: ev
  token_provider_6:
    module: DummyTokenProvider
    config_implementation:
      main:
        token: TOKEN6
        connector_id: 6
    connections:
      evse:
        - module_id: evse_manager_6
          implementation_id: evse
  api_sink_6:
    module: EnergyNode
    mapping:
      module:
        evse: 6
    config_module:
      # Per-connector ceiling. The API module only wires up set_limit_* for an EVSE that has a sink
      # with a matching evse mapping, so one of these per connector is mandatory, not optional.
      fuse_limit_A: 600.0
      phase_count: 3
    connections:
      energy_consumer:
        - module_id: evse_manager_6
          implementation_id: energy_grid
  # ------------------------------------------------------------------ shared station services
  auth:
    module: Auth
    config_module:
      connection_timeout: 10
      selection_algorithm: FindFirst
    connections:
      token_provider:
        - module_id: token_provider_1
          implementation_id: main
        - module_id: token_provider_2
          implementation_id: main
        - module_id: token_provider_3
          implementation_id: main
        - module_id: token_provider_4
          implementation_id: main
        - module_id: token_provider_5
          implementation_id: main
        - module_id: token_provider_6
          implementation_id: main
      token_validator:
        - module_id: token_validator
          implementation_id: main
      evse_manager:
        - module_id: evse_manager_1
          implementation_id: evse
        - module_id: evse_manager_2
          implementation_id: evse
        - module_id: evse_manager_3
          implementation_id: evse
        - module_id: evse_manager_4
          implementation_id: evse
        - module_id: evse_manager_5
          implementation_id: evse
        - module_id: evse_manager_6
          implementation_id: evse
  token_validator:
    module: DummyTokenValidator
    config_implementation:
      main:
        validation_result: Accepted
        validation_reason: Token seems valid
        sleep: 0.25
  evse_security:
    module: EvseSecurity
    config_module:
      private_key_password: "123456"
  energy_manager:
    module: EnergyManager
    config_module:
      schedule_total_duration: 1
      schedule_interval_duration: 60
      # The optimiser allocates power in fixed slices per trading round and gives up when it runs out
      # of rounds, enforcing whatever it had reached and logging "Trading: Maximum number of trading
      # rounds reached". Every connector consumes rounds, so the slices have to grow with the
      # connector count. Coarser slices converge within budget at the cost of less even distribution.
      slice_ampere: 10.0
      slice_watt: 5000
      debug: false
    connections:
      energy_trunk:
        - module_id: grid_connection_point
          implementation_id: energy_grid
  grid_connection_point:
    module: EnergyNode
    config_module:
      # The whole station: 960 kW. Power is fuse_limit_A x phase_count x
      # 230 V, so this is 960000 W / 690 W per amp.
      # Deliberately below the sum of the connectors, because a site that can always give every
      # connector its full rate never exercises the thing under test.
      fuse_limit_A: 1391.3
      phase_count: 3
    connections:
      price_information: []
      energy_consumer:
        - module_id: api_sink_1
          implementation_id: energy_grid
        - module_id: api_sink_2
          implementation_id: energy_grid
        - module_id: api_sink_3
          implementation_id: energy_grid
        - module_id: api_sink_4
          implementation_id: energy_grid
        - module_id: api_sink_5
          implementation_id: energy_grid
        - module_id: api_sink_6
          implementation_id: energy_grid
      powermeter:
        - module_id: yeti_driver_1
          implementation_id: powermeter
  api:
    module: API
    connections:
      evse_manager:
        - module_id: evse_manager_1
          implementation_id: evse
        - module_id: evse_manager_2
          implementation_id: evse
        - module_id: evse_manager_3
          implementation_id: evse
        - module_id: evse_manager_4
          implementation_id: evse
        - module_id: evse_manager_5
          implementation_id: evse
        - module_id: evse_manager_6
          implementation_id: evse
      error_history:
        - module_id: error_history
          implementation_id: error_history
      evse_energy_sink:
        - module_id: api_sink_1
          implementation_id: external_limits
        - module_id: api_sink_2
          implementation_id: external_limits
        - module_id: api_sink_3
          implementation_id: external_limits
        - module_id: api_sink_4
          implementation_id: external_limits
        - module_id: api_sink_5
          implementation_id: external_limits
        - module_id: api_sink_6
          implementation_id: external_limits
  ev_api:
    module: EvAPI
    connections:
      ev_manager:
        - module_id: ev_manager_1
          implementation_id: ev_manager
        - module_id: ev_manager_2
          implementation_id: ev_manager
        - module_id: ev_manager_3
          implementation_id: ev_manager
        - module_id: ev_manager_4
          implementation_id: ev_manager
        - module_id: ev_manager_5
          implementation_id: ev_manager
        - module_id: ev_manager_6
          implementation_id: ev_manager
  error_history:
    module: ErrorHistory
    config_implementation:
      error_history:
        database_path: /tmp/error_history.db
