# 6-connector SIL DC configuration - GENERATED FILE, DO NOT EDIT BY HAND.
#
# Source: EVerest-MCP/sim/generate_sil_config.py
# Regenerate: python sim/generate_sil_config.py --connectors 6 --output <this file>
#
# Models the Voltempo HGV charger: 6 DC connectors rated 375 kW each
# (800 V x 468 A), on a 960 kW site.
#
# The site limit is lower than the sum of the connectors on purpose. All 6 vehicles asking
# for their full rate is 2250 kW against 960 kW
# available, so the site is what constrains them - which is what an OCPP charging profile has to
# manage, and what a simulator sized at the sum of its connectors could never show.
#
# No CSMS. Each connector authorises itself through its own DummyTokenProvider, which is what makes
# the MQTT tools able to run a session start to finish with nothing else involved.
#
# PREREQUISITE: every connector's charger and car talk over their own veth pair, because V2G
# discovery in SIL is real link-local IPv6 multicast on UDP 15118. Run sil-net-setup.sh (which
# creates ev1-evse/ev1-car .. ev6-evse/ev6-car) before
# starting the manager, or the ISO 15118 modules will fail to bind and cars will pair with arbitrary
# chargers.
#
# MQTT addressing:
#   charger    everest_api/evse_manager_N/...            (keyed by EvseManager module id)
#   car        everest_external/nodered/N/carsim/...     (keyed by EvManager connector_id)

active_modules:
  # ------------------------------------------------------------------ connector 1
  iso15118_charger_1:
    module: EvseV2G
    config_module:
      # Explicit, never 'auto'. EvseV2G resolves 'auto' to a hard-coded eth1 (v2g_ctx.cpp), which
      # would put every charger on one link and let cars pair with the wrong one.
      device: ev1-evse
      tls_security: allow
    connections:
      security:
        - module_id: evse_security
          implementation_id: main
  iso15118_car_1:
    module: PyEvJosev
    config_module:
      # The other end of connector 1's veth pair. 'auto' picks the first interface with an IPv6
      # link-local address, which is the same one for every car.
      device: ev1-car
      supported_DIN70121: true
      supported_ISO15118_2: true
  evse_manager_1:
    module: EvseManager
    config_module:
      # The connector's id within its own vSECC, because that is what OCPP demands (see local_id).
      # With one vSECC this is the same as the connector's position on the charger.
      connector_id: 1
      # eMI3-style id presented to the vehicle over ISO 15118. Globally unique across the charger even
      # though connector_id is not - nothing in OCPP 1.6 carries this string, so it is free to be the
      # human-meaningful one.
      evse_id: UK*VTP*E00001*1
      # Kept keyed on the connector's position on the charger, not its board. DIN 70121 wants a
      # fixed-width id and nothing reads it back, so global numbering is the safer choice.
      evse_id_din: 49A80737A45671
      session_logging: true
      session_logging_xml: false
      session_logging_path: /tmp/everest-logs
      charge_mode: DC
      hack_allow_bpt_with_iso2: true
      # Load-bearing, and off by default. Without it an idle connector keeps asking for its share of
      # the site, so one vehicle on an otherwise empty charger is held to site/connectors rather than
      # its own rating - which is exactly the real charger's flaw, arrived at by accident. With it,
      # idle connectors release their share and the vehicles that are charging get it.
      request_zero_power_in_idle: true
    connections:
      bsp:
        - module_id: yeti_driver_1
          implementation_id: board_support
      powermeter_car_side:
        - module_id: powersupply_dc_1
          implementation_id: powermeter
      slac:
        - module_id: slac_1
          implementation_id: evse
      hlc:
        - module_id: iso15118_charger_1
          implementation_id: charger
      powersupply_DC:
        - module_id: powersupply_dc_1
          implementation_id: main
      imd:
        - module_id: imd_1
          implementation_id: main
      over_voltage_monitor:
        - module_id: ovm_1
          implementation_id: main
  powersupply_dc_1:
    module: DCSupplySimulator
    config_implementation:
      main:
        # Defaults are 150 kW / 200 A, which bind well below the target. These are
        # config_implementation, not config_module - they live under provides.main in the manifest.
        max_power: 375000
        nominal_max_export_power: 375000
        nominal_max_import_power: 375000
        max_current: 500.0
        nominal_max_current: 500.0
  yeti_driver_1:
    module: YetiSimulator
    config_module:
      connector_id: 1
      max_current_A_import: 600.0
  slac_1:
    module: SlacSimulator
  imd_1:
    module: IMDSimulator
    config_implementation:
      main:
        selftest_success: true
        resistance_F_Ohm: 900000
  ovm_1:
    module: OVMSimulator
    config_implementation:
      main:
        simulate_emergency_shutdown: false
        simulate_error_delay: 5
    connections:
      power_supply:
        - module_id: powersupply_dc_1
          implementation_id: main
  ev_manager_1:
    module: EvManager
    config_module:
      connector_id: 1
      auto_enable: true
      auto_exec: false
      dc_target_current: 468
      dc_target_voltage: 800
      dc_max_power_limit: 375000
      dc_max_current_limit: 500
      dc_max_voltage_limit: 900
    connections:
      ev_board_support:
        - module_id: yeti_driver_1
          implementation_id: ev_board_support
      ev:
        - module_id: iso15118_car_1
          implementation_id: ev
      slac:
        - module_id: slac_1
          implementation_id: ev
  token_provider_1:
    module: DummyTokenProvider
    config_implementation:
      main:
        token: TOKEN1
        connector_id: 1
    connections:
      evse:
        - module_id: evse_manager_1
          implementation_id: evse
  api_sink_1:
    module: EnergyNode
    mapping:
      module:
        evse: 1
    config_module:
      # Per-connector ceiling. The API module only wires up set_limit_* for an EVSE that has a sink
      # with a matching evse mapping, so one of these per connector is mandatory, not optional.
      fuse_limit_A: 600.0
      phase_count: 3
    connections:
      energy_consumer:
        - module_id: evse_manager_1
          implementation_id: energy_grid
