active_modules:
  probe:
    module: ProbeModule
    connections:
      energy_observer:
        - module_id: energy_node
          implementation_id: energy_grid
  energy_node:
    module: EnergyNode
    config_module:
      fuse_limit_A: 32
      phase_count: 3
      nominal_voltage_V: 230
      enhance_external_schedule: false
      phase_rotation: '312'
    connections:
      energy_consumer:
        - module_id: probe
          implementation_id: energy_consumer_probe
      powermeter:
        - module_id: probe
          implementation_id: powermeter_probe
  energy_manager:
    module: EnergyManager
    connections:
      energy_trunk:
        - module_id: energy_node
          implementation_id: energy_grid
